<svg xmlns="http://www.w3.org/2000/svg" width="375" height="940" viewBox="0 0 375 940" role="img" aria-labelledby="title desc">
<title id="title">CPB 期間氧輸送下降的兩種機制</title>
<desc id="desc">病例敘述分別出現靜脈回流不足與血液稀釋兩種情況；表中 SaO2 為整段 CPB 平均，並非兩事件的同期數據。</desc>
<rect width="375" height="940" rx="16" fill="#f5f8fa"/>
<rect x="12" y="12" width="351" height="112" rx="14" fill="#18394c"/>
<text x="28" y="47" font-family="Noto Sans CJK TC, sans-serif" font-size="22" font-weight="700" fill="#fff">氧輸送下降的兩條路</text>
<text x="28" y="77" font-family="Noto Sans CJK TC, sans-serif" font-size="17" fill="#fff">真實瓣膜手術病例・CPB 期間</text>
<text x="28" y="103" font-family="Noto Sans CJK TC, sans-serif" font-size="15" fill="#e2eef4">不是術後 ICU 心輸出量曲線</text>
<rect x="12" y="140" width="351" height="236" rx="14" fill="#e7f4f0" stroke="#81ada4"/>
<text x="28" y="173" font-family="Noto Sans CJK TC, sans-serif" font-size="20" font-weight="700" fill="#12534c">A｜靜脈回流不足</text>
<text x="28" y="205" font-family="Noto Sans CJK TC, sans-serif" font-size="17" fill="#174c48">有效 pump flow 受限</text>
<text x="28" y="246" font-family="Noto Sans CJK TC, sans-serif" font-size="19" fill="#174c48">DO2i 下降至</text>
<text x="28" y="293" font-family="Noto Sans, sans-serif" font-size="37" font-weight="700" fill="#0e746b">260</text>
<text x="118" y="290" font-family="Noto Sans, sans-serif" font-size="17" fill="#174c48">mL/min/m²</text>
<path d="M184 300 v24 m-8 -8 l8 9 8 -9" stroke="#0e746b" fill="none" stroke-width="3"/>
<text x="28" y="350" font-family="Noto Sans CJK TC, sans-serif" font-size="17" fill="#174c48">調整回流／管路與幫浦流量</text>
<rect x="12" y="392" width="351" height="242" rx="14" fill="#fff1e5" stroke="#d9ae88"/>
<text x="28" y="425" font-family="Noto Sans CJK TC, sans-serif" font-size="20" font-weight="700" fill="#86491d">B｜血液稀釋</text>
<text x="28" y="459" font-family="Noto Sans CJK TC, sans-serif" font-size="17" fill="#86491d">Hb 下降，攜氧容量減少</text>
<text x="28" y="494" font-family="Noto Sans CJK TC, sans-serif" font-size="17" fill="#86491d">病例敘述：Hb 7.9 g/dL</text>
<text x="28" y="536" font-family="Noto Sans CJK TC, sans-serif" font-size="19" fill="#86491d">DO2i 約</text>
<text x="28" y="582" font-family="Noto Sans, sans-serif" font-size="37" font-weight="700" fill="#a85623">275</text>
<text x="118" y="578" font-family="Noto Sans, sans-serif" font-size="17" fill="#86491d">mL/min/m²</text>
<text x="28" y="613" font-family="Noto Sans CJK TC, sans-serif" font-size="17" fill="#86491d">增加 pump flow 後回升</text>
<rect x="12" y="650" width="351" height="272" rx="14" fill="#fff" stroke="#c8d9e2"/>
<text x="28" y="684" font-family="Noto Sans CJK TC, sans-serif" font-size="20" font-weight="700" fill="#18394c">讀圖時不可錯接</text>
<text x="28" y="720" font-family="Noto Sans CJK TC, sans-serif" font-size="16" fill="#29485a">① SaO2 98 ± 0.5% 是 CPB 平均</text>
<text x="28" y="752" font-family="Noto Sans CJK TC, sans-serif" font-size="16" fill="#29485a">② 並非事件當下的同步血氣</text>
<text x="28" y="784" font-family="Noto Sans CJK TC, sans-serif" font-size="16" fill="#29485a">③ 不重建矛盾的事件時間軸</text>
<text x="28" y="816" font-family="Noto Sans CJK TC, sans-serif" font-size="16" fill="#29485a">④ 術後流量來源改為 CO</text>
<text x="28" y="863" font-family="Noto Sans CJK TC, sans-serif" font-size="15" fill="#526b78">Civelek et al., Cureus 2025</text>
<text x="28" y="887" font-family="Noto Sans CJK TC, sans-serif" font-size="15" fill="#526b78">本站原創機轉圖，非原論文重製</text>
</svg>