name: Archive validated Silverman ECG originals once
on:
  push:
    branches:
      - fix/vte-replace-misleading-figures-20261027
    paths:
      - .github/workflows/archive-silverman-once.yml
permissions:
  contents: write
  actions: read
jobs:
  commit-pinned-ecg:
    if: github.repository == 'sheng-web-OS/Clinical_system'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover successful audited original-image build artifact
        uses: actions/download-artifact@v4
        with:
          run-id: 40368467168
          name: clinical-system-static-site
          path: .original-image-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify original bytes and archive in version control
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          from tools.fetch_arrhythmia_figures import FIGURES, EXPECTED_SHA256, jpeg_dimensions
          source=Path('.original-image-artifact/assets')
          destination=Path('site/source-assets/silverman-2018')
          destination.mkdir(parents=True,exist_ok=True)
          for name,(_,dims) in FIGURES.items():
              data=(source/name).read_bytes()
              assert data[:2]==bytes.fromhex('ffd8') and data[-2:]==bytes.fromhex('ffd9'), name
              assert jpeg_dimensions(data)==dims, (name, jpeg_dimensions(data), dims)
              sha=hashlib.sha256(data).hexdigest()
              assert sha==EXPECTED_SHA256[name], (name, sha)
              (destination/name).write_bytes(data)
              print('ARCHIVED VERIFIED',name,len(data),sha)
          PY
      - name: Commit audit-verified public-license original ECGs
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/source-assets/silverman-2018/
          if ! git diff --cached --quiet; then
            git commit -m 'Archive SHA-pinned CC BY Silverman ECG originals for reproducible builds'
            git push origin HEAD:fix/vte-replace-misleading-figures-20261027
          fi
