name: Validate and build medical site
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Distinct pull requests must finish their own QA; only supersede stale
  # runs on the same branch or PR, not unrelated article reviews.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install rendering dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run editorial and publication regression tests
        run: python -m unittest discover -s tests
      - name: Evidence-gated site build
        run: bash tools/build_site.sh
      - name: Install medical figure visual-test browser
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Inspect real 360/390/768/1280px clinical image rendering
        run: python tools/visual_qa_browser.py --pages wpw preexcited-af wct --widths 360 390 768 1280
      - name: Render modified published figures automatically
        # A PR changing an article gets real mobile/desktop screenshots without
        # maintaining a hand-written figure list. Medical review remains separate.
        if: github.event_name == 'pull_request'
        run: python tools/visual_qa_browser.py --changed-from origin/main --widths 360 390 1280 --output visual-qa-artifacts/changed
      - name: Save source-image visual QA screenshots and failure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clinical-figure-visual-qa
          path: visual-qa-artifacts/
          if-no-files-found: warn
          retention-days: 14
      - name: Save verified static site
        uses: actions/upload-artifact@v4
        with:
          name: clinical-system-static-site
          path: dist/
          if-no-files-found: error
          retention-days: 7
