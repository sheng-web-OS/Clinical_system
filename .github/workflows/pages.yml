name: Validate and build medical site
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Distinct pull requests must finish their own QA; only supersede stale
  # runs on the same branch or PR, not unrelated article reviews.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04  # Playwright 1.57 Chromium does not support 26.04 yet
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Restore checksum-pinned Silverman ECG cache
        uses: actions/cache@v4
        with:
          path: .figure-cache/silverman2018/
          key: silverman-2018-originals-sha256-v1-${{ runner.os }}
      - name: Install rendering dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run editorial and publication regression tests
        run: python -m unittest discover -s tests
      # Preview artifacts stay PRIVATE in Actions. Never deploy or upload dist here.
      # Medical/teaching approval remains a separate mandatory release gate below.
      - name: Render unapproved PR draft for private visual QA only
        if: github.event_name == 'pull_request'
        run: |
          python site/build.py
          python tools/check_output.py
      - name: Install Chromium for image layout QA
        if: github.event_name == 'pull_request'
        timeout-minutes: 12  # browser bootstrap stays bounded; apt mirror stalls cannot fail at 4 minutes
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          # Install the browser before touching apt: hosted Ubuntu already provides
          # most runtime libraries. Avoid downloading nonessential distro font packs
          # on every PR, which previously stalled at azure.archive.ubuntu.com.
          python -m playwright install chromium
          # A real launch is mandatory. If the runner lacks libraries, install
          # Playwright's official dependencies and retry; never skip visual QA.
          if ! python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(headless=True); b.close(); p.stop()'; then
            python -m playwright install-deps chromium
            python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(headless=True); b.close(); p.stop()'
          fi
      - name: Restore pinned Traditional Chinese browser font
        if: github.event_name == 'pull_request'
        uses: actions/cache@v4
        with:
          path: ~/.local/share/fonts/NotoSansTC-VF.ttf
          key: noto-tc-browser-v2004-523d033d
      - name: Validate Traditional Chinese glyphs before screenshots
        if: github.event_name == 'pull_request'
        timeout-minutes: 4
        run: |
          mkdir -p "$HOME/.local/share/fonts"
          FONT="$HOME/.local/share/fonts/NotoSansTC-VF.ttf"
          if [ ! -s "$FONT" ]; then
            # Official Noto CJK, Taiwan subset; source commit pinned, not main.
            curl --fail --location --silent --show-error --retry 2 \
              --connect-timeout 15 --max-time 180 \
              'https://raw.githubusercontent.com/notofonts/noto-cjk/523d033d6cb47f4a80c58a35753646f5c3608a78/Sans/Variable/TTF/Subset/NotoSansTC-VF.ttf' \
              --output "$FONT"
          fi
          test "$(stat -c '%s' "$FONT")" -gt 2000000
          fc-cache -f "$HOME/.local/share/fonts"
          fc-match -f '%{family}\\n' 'Noto Sans TC' | grep -F 'Noto Sans TC'
          sha256sum "$FONT"
      - name: Verify official exam study links on 360/375/390px phones
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet origin/main...HEAD -- site/pages.json site/exam_archive.py site/build.py site/styles.css tools/qa_exam_year_mobile.py; then
            python tools/qa_exam_year_mobile.py --output visual-qa-artifacts/exam-year
          fi
      - name: Enforce SAAG exam table readability on phone
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet origin/main...HEAD -- site/styles.css site/build.py content/xiaoma-internal-medicine/lessons/2026-10-27-gi-liver-exam-trio.md; then
            python tools/qa_saag_mobile.py --output visual-qa-artifacts/saag
          fi
      - name: Block newly added or changed figures with broken rendering
        if: github.event_name == 'pull_request'
        run: python tools/visual_qa_browser.py --changed-from origin/main --widths 360 375 390 1280 --output visual-qa-artifacts/changed
      - name: Check Sepsis reader and exam on 360/375/390px private browser
        if: github.event_name == 'pull_request'
        run: |
          if grep -q 'clinical-sepsis-infection-to-shock.html' site/pages.json; then
            if ! git diff --quiet origin/main...HEAD -- site/pages.json site/styles.css site/build.py tools/qa_sepsis_mobile.py content/clinical-os/2026-10-27-sepsis-from-infection-to-resuscitation.md content/xiaoma-internal-medicine/exams/sepsis-core-112-114-med3.md content/clinical-os/sepsis-visual-evidence-and-sources.md; then
              python tools/qa_sepsis_mobile.py --widths 360 375 390 --output visual-qa-artifacts/sepsis
            fi
          fi
      - name: Audit full legacy visual debt when shared rendering changes
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          if ! git diff --quiet origin/main...HEAD -- site/styles.css site/build.py tools/visual_qa_browser.py; then
            python tools/visual_qa_browser.py --all --widths 360 390 1280 --output visual-qa-artifacts/legacy
          fi
      - name: Retain browser visual QA screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clinical-figure-browser-qa
          path: visual-qa-artifacts/
          if-no-files-found: warn
          retention-days: 14
      - name: Evidence-gated site build
        run: bash tools/build_site.sh
      - name: Save verified static site
        uses: actions/upload-artifact@v4
        with:
          name: clinical-system-static-site
          path: dist/
          if-no-files-found: error
          retention-days: 7
