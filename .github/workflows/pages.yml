name: Validate and build medical site
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Distinct pull requests must finish their own QA; only supersede stale
  # runs on the same branch or PR, not unrelated article reviews.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # PR merge result needs its actual base for a fail-safe diff.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Classify PR publication scope (fail closed)
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo 'scope=full_site' >> "$GITHUB_OUTPUT"
            echo 'full_build=true' >> "$GITHUB_OUTPUT"
          else
            git cat-file -e "${BASE_SHA}^{commit}"
            git diff --no-renames --no-ext-diff --name-only -z "$BASE_SHA" HEAD > "$RUNNER_TEMP/clinical-pr-paths0"
            python tools/classify_ci_scope.py \
              --paths0 "$RUNNER_TEMP/clinical-pr-paths0" \
              --github-output "$GITHUB_OUTPUT"
          fi
      - name: Restore checksum-pinned Silverman ECG cache
        uses: actions/cache@v4
        if: steps.scope.outputs.full_build == 'true'
        with:
          path: .figure-cache/silverman2018/
          key: silverman-2018-originals-sha256-v1-${{ runner.os }}
      - name: Install rendering dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run editorial and publication regression tests
        run: python -m unittest discover -s tests
      - name: Validate publication sources and private intake corpus
        run: |
          python tools/validate.py
          python tools/check_corpus_inventory.py
      - name: Evidence-gated site build
        if: steps.scope.outputs.full_build == 'true'
        run: bash tools/build_site.sh
      - name: Save verified static site
        if: steps.scope.outputs.full_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: clinical-system-static-site
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Explain private-only result
        if: steps.scope.outputs.full_build == 'false'
        run: |
          echo 'Private intake PR: tests, public source validation and corpus checks passed.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No public page, site code or publication audit was changed; full build is mandatory on main.' >> "$GITHUB_STEP_SUMMARY"
          echo 'This is NOT a medical, figure, rights or publication approval.' >> "$GITHUB_STEP_SUMMARY"
