name: Validate and build medical site
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: medical-editorial
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install rendering dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run editorial and publication regression tests
        run: python -m unittest discover -s tests
      - name: Evidence-gated site build
        run: bash tools/build_site.sh
      - name: Save verified static site
        uses: actions/upload-artifact@v4
        with:
          name: clinical-system-static-site
          path: dist/
          if-no-files-found: error
          retention-days: 7
