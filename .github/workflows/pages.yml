name: Validate and build medical site
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Distinct pull requests must finish their own QA; only supersede stale
  # runs on the same branch or PR, not unrelated article reviews.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Restore checksum-pinned Silverman ECG cache
        uses: actions/cache@v4
        with:
          path: .figure-cache/silverman2018/
          key: silverman-2018-originals-sha256-v1-${{ runner.os }}
      - name: Install rendering dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run editorial and publication regression tests
        run: python -m unittest discover -s tests
      - name: Evidence-gated site build
        run: bash tools/build_site.sh
      - name: Install Traditional Chinese fonts for visual QA
        timeout-minutes: 3
        run: |
          set -euo pipefail
          if ! fc-list :lang=zh-tw family | grep -qi 'Noto Sans CJK'; then
            # One immutable, checksum-pinned open-source glyph font; avoid apt mirror stalls.
            FONT=/tmp/NotoSansCJKtc-Regular.otf
            curl --fail --location --silent --show-error --connect-timeout 10 --max-time 65 --retry 2 --retry-delay 2 \
              'https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/TraditionalChinese/NotoSansCJKtc-Regular.otf' -o "$FONT"
            python - <<'PY'
          import hashlib
          from pathlib import Path
          data = Path("/tmp/NotoSansCJKtc-Regular.otf").read_bytes()
          digest = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\\0" + data).hexdigest()
          expected = "f9376bae1d421520f73a3c6c9d50b22f89548301"
          if digest != expected:
              raise ValueError(f"Noto CJK font origin checksum mismatch: {digest}")
          print("PASS: checksum-pinned Noto CJK Traditional Chinese font",len(data))
          PY
            install -d "$HOME/.local/share/fonts"
            cp "$FONT" "$HOME/.local/share/fonts/"
          fi
          fc-cache -f "$HOME/.local/share/fonts"
          fc-list :lang=zh-tw family | grep -qi 'Noto Sans CJK'
      - name: Install isolated browser-QA dependency
        run: python -m pip install --disable-pip-version-check playwright==1.57.0
      - name: Capture required figure in desktop and mobile browsers
        run: python tools/capture_primary_visual.py
      - name: Upload primary figure visual QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: primary-figure-visual-qa
          path: visual-qa-preview/
          if-no-files-found: error
          retention-days: 14
      - name: Save verified static site
        uses: actions/upload-artifact@v4
        with:
          name: clinical-system-static-site
          path: dist/
          if-no-files-found: error
          retention-days: 7
