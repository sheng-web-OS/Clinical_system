name: P1 review hard stop

# A post-CI review warning must invalidate the CURRENT PR head, not the
# main-branch workflow SHA. This separate status requires a GitHub ruleset.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review, labeled, unlabeled]
  issue_comment:
    types: [created, edited, deleted]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: write

concurrency:
  group: p1-review-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  publish-pr-head-status:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-24.04
    steps:
      # pull_request_target runs privileged: NEVER check out PR HEAD.
      - name: Check out trusted default branch policy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Evaluate all current P0/P1 blockers and set exact-HEAD status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/p1_review_gate.py
