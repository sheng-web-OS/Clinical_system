<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1130" width="600" height="1130" role="img" aria-labelledby="title description">
<title id="title">CABG 術前、手術後、隔日的七組群體平均血液數值對照</title>
<desc id="description">2013 Chuah 等人的 on-pump CABG 55 人群體平均，各列分別標明鈉、氯、SID、HCO3、BE、氫離子及 PaCO2 在術前、術後、隔日的數字。各列採獨立縱向尺度，不代表個人血氣；數據不能直接建立因果。</desc>
