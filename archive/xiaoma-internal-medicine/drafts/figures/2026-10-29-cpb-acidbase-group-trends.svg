<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1100" viewBox="0 0 390 1100" role="img" aria-labelledby="charttitle chartdesc">
<title id="charttitle">CABG 55 名 on-pump 病人的血液酸鹼群體平均七項指標比較</title>
<desc id="chartdesc">2013 Chuah 研究，55 人群體平均。數據依原論文 Table 3，時間為術前、完成 CABG 並給予 protamine 後、隔日早晨；各數值按原文單位呈現，箭頭代表相鄰時間平均值方向，並非個人數據。無乳酸或 albumin 實測。</desc>
